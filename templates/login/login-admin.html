<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1989644912.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'global.css' %}">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <title>Login</title>
</head>
<body>
    <main class="conteiner">
        <form action="{% url 'lanch:login-admin' %}" method="POST">
            {% csrf_token %}
            <h1>Login Adiministrador</h1>
            <div class="inputs">
                <input placeholder="Email" type="email" name="email">
            </div>
            <div class="inputs">
                <input placeholder="Senha" type="password" name="senha">
            </div>
            <div class="bt-login">
                <button type="submit">Logar</button>
            </div>
            <div class="cadastro">
                <p>Ainda não tem uma conta? <a href="{% url 'lanch:cadastro' %}">Cadastre-se</a></p>
            </div>
        </form>
    </main>
</body>
</html>
