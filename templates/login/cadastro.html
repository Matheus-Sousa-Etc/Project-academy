<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1989644912.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'global.css' %}">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <title>Cadastro</title>
</head>
<body>
    <main class="conteiner">
        <form action="{% url 'lanch:cadastro' %}" method="POST">
            {% csrf_token %} <!--se nao colocar isso o django nao vai querer funcionar/enviar as infos pro bd :)-->
                            <!-- é o bagulho de segurança, não é? Tem que ser seguro, vai que o professor tenta invadir e tira ponto nosso '-' -->
            
            <h1>Cadastro</h1>
            <div class="inputs">
                <input placeholder="Email" type="email" name="email">
            </div>
            <div class="inputs">
                <input placeholder="Senha" type="password" name="senha">
            </div>
            <div class="inputs">
                <input placeholder="Nome" type="text" name="nome">
            </div>
            <div class="inputs">
                <input placeholder="Celular" type="tel" name="numero">
            </div>
             <div class="inputs">
                <input placeholder="CPF" type="text" name="cpf">
            </div>
             <div class="inputs">
                <input placeholder="Endereço" type="text" name="endereco">
            </div>
            <div class="bt-login">
                <button type="submit">Cadastre-se</button>
            </div>
            <div class="cadastro">
                <p>Já tem uma conta? <a href="{%url 'lanch:login' %}">Login</a></p>
            </div>
        </form>
    </main>
</body>
</html>
