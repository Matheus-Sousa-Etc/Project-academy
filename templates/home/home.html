<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1989644912.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'global.css' %}">
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'modal.css' %}">
    <title>Página principal</title>
</head>
<body>
    <nav>
        <a class="logo" href="{% url 'lanch:home' %}">Academia</a>
        <ul class="menu-list">
            <li><a href="#"><i class="fa-solid fa-circle-user fa-2x"></i></a></li>
            <li><a href="#"><i class="fa-solid fa-envelope fa-2x"></i></a></li>
            <li><a href="{% url 'lanch:carrinho' %}"><i class="fa-solid fa-cart-shopping fa-2x"></i></a></li>
        </ul>
    </nav>
    <main class="conteiner">
        <div class="blocos">
            <h1>Aulas</h1>
            <ul class="aulas">
                <li><a href="javascript:void(0)" onclick="abrirModal1()">Musculação</a></li>
                <li><a href="javascript:void(0)" onclick="abrirModal2()">Crossfit</a></li>
                <li><a href="javascript:void(0)" onclick="abrirModal3()">Pilates</a></li>
                <li><a href="javascript:void(0)" onclick="abrirModal4()">Jump</a></li>
            </ul>
        </div>
        <div class="blocos">
            <h1>Lanchonete</h1>
            <ul class="aulas">
                <li><a href="{% url 'lanch:suplementos' %}">Suplementos</a></li>
                <li><a href="{% url 'lanch:equipamentos' %}">Equipamentos</a></li>
            </ul>
        </div>
    </main>

    <!--Bora fazer pop ups do jeito mais porco-->
    <dialog id="modal1" class="popup">
        <h2>Musculação</h2>
        <p>Quer marcar essa aula?</p>
        <button class="bt" onclick="fecharModal1()">Fechar</button>
        <a href="{% url 'lanch:vagas' musculacao.id %}"><button type="submit" class="bt">Confirmar</button></a>
    </dialog>
    <script>
        function abrirModal1() {
            document.getElementById('modal1').style.display = 'block';
        }

        function fecharModal1() {
            document.getElementById('modal1').style.display = 'none';
        }
    </script>

    <!--Segundo modal-->
    <dialog id="modal2" class="popup">
        <h2>Crossfit</h2>
        <p>Quer marcar essa aula?</p>
        <button class="bt" onclick="fecharModal2()">Fechar</button>
        <a href="{% url 'lanch:vagas' crossfit.id %}"><button type="submit" class="bt">Confirmar</button></a>
    </dialog>
    <script>
        function abrirModal2() {
            document.getElementById('modal2').style.display = 'block';
        }

        function fecharModal2() {
            document.getElementById('modal2').style.display = 'none';
        }
    </script>

    <!--Terceiro modal-->
    <dialog id="modal3" class="popup">
        <h2>Pilates</h2>
        <p>Quer marcar essa aula?</p>
        <button class="bt" onclick="fecharModal3()">Fechar</button>
        <a href="{% url 'lanch:vagas' pilates.id %}"><button type="submit" class="bt">Confirmar</button></a>
    </dialog>
    <script>
        function abrirModal3() {
            document.getElementById('modal3').style.display = 'block';
        }

        function fecharModal3() {
            document.getElementById('modal3').style.display = 'none';
        }
    </script>

    <!--Quarto modal-->
    <dialog id="modal4" class="popup">
        <h2>Jump</h2>
        <p>Quer marcar essa aula?</p>
        <button class="bt" onclick="fecharModal4()">Fechar</button>
        <a href="{% url 'lanch:vagas' jump.id %}"><button type="submit" class="bt">Confirmar</button></a>
    </dialog>
    <script>
        function abrirModal4() {
            document.getElementById('modal4').style.display = 'block';
        }

        function fecharModal4() {
            document.getElementById('modal4').style.display = 'none';
        }
    </script>
</body>
</html>
